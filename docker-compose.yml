version: "3.8"

services:
  # ────────────────────────────────────────────────────────────
  # PostgreSQL 16 with pgvector Extension
  # ────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hoichoi_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hoichoi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoichoi_secret}
      POSTGRES_DB: ${POSTGRES_DB:-content_studio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hoichoi} -d ${POSTGRES_DB:-content_studio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────────
  # AI Content Studio Next.js 15 Application
  # ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hoichoi_content_studio
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://hoichoi:hoichoi_secret@postgres:5432/content_studio?sslmode=disable}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
