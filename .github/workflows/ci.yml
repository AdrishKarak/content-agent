name: AI Content Studio CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Type Safety & Code Quality
  # ────────────────────────────────────────────────────────────
  quality-check:
    name: Typecheck & Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript Types
        run: pnpm typecheck

  # ────────────────────────────────────────────────────────────
  # 2. Automated Test Suite (Deterministic Checks & Guardrails)
  # ────────────────────────────────────────────────────────────
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run Unit & Guardrail Tests
        run: pnpm test

  # ────────────────────────────────────────────────────────────
  # 3. Next.js Production Build
  # ────────────────────────────────────────────────────────────
  build:
    name: Next.js Standalone Production Build
    runs-on: ubuntu-latest
    needs: test
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mock?sslmode=disable"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Build Next.js Production Bundle
        run: pnpm build

  # ────────────────────────────────────────────────────────────
  # 4. Docker Container Verification
  # ────────────────────────────────────────────────────────────
  docker-verify:
    name: Docker Containerization Build & Verify
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: hoichoi/ai-content-studio:latest
